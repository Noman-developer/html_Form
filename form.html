<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-box">
    <h2>Basic User Registration Form</h2>

    <form id="regForm" novalidate>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        <span class="error" id="nameError"></span>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <span class="error" id="emailError"></span>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Min 6 characters">
        <span class="error" id="passwordError"></span>

        <label>Gender:</label>
        <div class="inline-group">
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <span class="error" id="genderError"></span>

        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="">Select your country</option>
            <option>Pakistan</option>
            <option>India</option>
            <option>Bangladesh</option>
            <option>UK</option>
            <option>Other</option>
        </select>
        <span class="error" id="countryError"></span>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" placeholder="Write your message here..."></textarea>

        <div class="inline-group">
            <input type="checkbox" id="terms" name="terms">
            <label for="terms">I accept the Terms &amp; Conditions</label>
        </div>
        <span class="error" id="termsError"></span>

        <button type="submit">Submit</button>
    </form>

    <div id="successBox" class="hidden">
        <h3>Registration successful!</h3>
        <p>Thank you for registering. Here is what you submitted:</p>
        <ul id="summary"></ul>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
